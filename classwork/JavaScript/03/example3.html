<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>二级联动菜单1</title>
	<style>
		select {
			font-size: 25px;
		}
	</style>
</head>

<body onload="showWeb()">
	<select id="sel1" onchange="showSite()">
		<option value="-1">请选择网站</option>
	</select>
	<select id="sel2">
		<option value="-1">请选择网站</option>
	</select>
	<script>
		//利用两个一维数组保存数据
		let sel1Arr = ["校园网站", "国内网站", "国外网站"];
		let sel2Arr = [
			["教育在线", "电子邮件", "图书馆", "后勤服务大厅", "学生工作"],
			["新浪网", "网易", "搜狐", "百度"],
			["惠普", "IBM", "微软"]
		];
		let sel1 = document.getElementById("sel1");//将获取第一个下拉框元素节点放在函数外面,两个函数都需要

		//定义函数

		function showWeb(){
			for(let i = 0; i < sel1Arr.length; i++){
				let option = document.createElement("option");
				option.text = sel1Arr[i];
				sel1.add(option);
			}

		}

		function showSite(){
			let sel2 = document.getElementById("sel2");
			sel2.length = 1;

			let index = sel1.selectedIndex;
			let current = sel2Arr[index - 1]; 
			
			for(let i = 0; i < current.length; i++){
				let option = document.createElement("option");
				option.text = current[i];
				sel2.add(option);
			}
		}

	</script>
</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Document</title>
    <style>
		h2{
			width:800px;
			text-align:center;
			border:1px solid #000000;
		}
	</style>

</head>

<body>
	<h2 id="scrollText">三更灯火五更鸡，正是男儿读书时。黑发不知勤学早，白首方悔读书迟。</h2>
	<input type="button" value="开始" onclick="start();">
	<input type="button" value="暂停" onclick="pause();">
	<script>
		let timer=null;  //全局变量存放定时器
		
		//定义函数
		function start(){
			if(timer !== null){
				return;
			}

			let h2 = document.getElementById("scrollText");
			timer = setInterval(function(){
				let str = h2.innerText;
				h2.innerText = str.substring(1) + str.substring(0, 1);
			}, 500);
		}
		function pause(){
			clearInterval(timer);
			timer = null;
		}
	</script>
</body>

</html>

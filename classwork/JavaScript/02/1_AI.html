<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>百分制转五等级制</title>
</head>
<body>
    <script>
        // prompt 返回字符串，用 Number() 转成数字再比较
        let score = Number(prompt("请输入分数（0-100）："));

        // 先校验输入范围（NaN 表示不是数字）
        if (isNaN(score) || score < 0 || score > 100) {
            console.log("输入有误，请输入0-100之间的数字！");
        } else {
            // if 多分支：顺序从高到低，else if 天然满足"上一个条件不成立"
            let grade;
            if (score >= 90) {          // 90 分(含)以上
                grade = "A";
            } else if (score >= 80) {   // 80(含) ~ 90(不含)
                grade = "B";
            } else if (score >= 70) {   // 70(含) ~ 80(不含)
                grade = "C";
            } else if (score >= 60) {   // 60(含) ~ 70(不含)
                grade = "D";
            } else {                    // 60 分(不含)以下
                grade = "E";
            }

            console.log(`分数：${score}，等级：${grade}`);
        }
    </script>
</body>
</html>

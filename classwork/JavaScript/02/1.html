<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let score = prompt("请输入您的分数(0-100)");

        if(score == NaN || score < 0 || score > 100)
        {
            alert("请输入0-100之间的数字!");
        }
        else{
            let grade;
            if(score >= 90){
                grade = "A";
            }else if(score >= 80){
                grade = "B";
            }
            else if(grade >= 70){
                grade = "C";
            }
            else if(grade >= 60){
                grade = "D";
            }
            else grade = "E";
            
            console.log(`分数:${score}----等级:${grade}`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人信息录入</title>
</head>
<body>
    <script>
        // 依次输入学院、班级、姓名、学号（class 是保留字，用 stuClass）
        var college = prompt("请输入你的学院：");
        var stuClass = prompt("请输入你的班级：");
        var name = prompt("请输入你的姓名：");
        var id = prompt("请输入你的学号：");

        // 用模板字符串拼接并弹窗显示（反引号包裹，${} 放变量，可直接换行）
        alert(`学院：${college}
班级：${stuClass}
姓名：${name}
学号：${id}`);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数字转星期</title>
</head>
<body>
    <script>
        // prompt 返回字符串，用 Number() 转成数字再比较
        let day = Number(prompt("请输入一个数字（0-6）："));
        let weekday = "";
        let valid = true;

        switch (day) {
            case 0:
                weekday = "星期日";
                break;
            case 1:
                weekday = "星期一";
                break;
            case 2:
                weekday = "星期二";
                break;
            case 3:
                weekday = "星期三";
                break;
            case 4:
                weekday = "星期四";
                break;
            case 5:
                weekday = "星期五";
                break;
            case 6:
                weekday = "星期六";
                break;
            default:                       // 0-6 以外的输入
                alert("输入有误，请输入0-6的数字！");
                valid = false;
        }

        // 输入合法时，以 h1 标题显示到页面
        if (valid) {
            document.write(`<h1>${weekday}</h1>`);
        }
    </script>
</body>
</html>

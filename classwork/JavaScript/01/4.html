<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let sum1 = 0;
        for(let i = 1; i <= 1000; i++){
            sum1 += i;
        }
        console.log("1到1000的累加和为:" + sum1);

        let sum2 = 0, j = 1;
        while(j <= 1000){
            sum2 += j;
            j++;
        }
        console.log("1到1000的累加和为:" + sum2);

    </script>
</body>
</html>
